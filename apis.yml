name: Achira
description: 'Achira is a digital-biology company building molecular world models to transform drug
  discovery and the physical sciences. Founded by John Chodera, Theofanis Karaletsos, and Zavain Dar, it
  blends geometric deep learning, generative AI, physics, quantum chemistry, and statistical mechanics
  into foundation simulation models that enable out-of-distribution prediction at the atomistic scale —
  a "third path" between pure machine-learning approaches and traditional molecular dynamics simulation.
  Achira raised a $33M Series A from Dimension, Amplify Partners, NVIDIA NVentures, and Compound. As of
  this profile the company publishes no public developer API, documentation, or SDKs.'
